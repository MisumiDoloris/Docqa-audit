[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-audit"
version = "0.1.0"
description = "给文档问答流水线做三层验收：解析、检索、生成"
authors = [{ name = "MisumiDoloris" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
docqa-audit = "docqa_audit.cli:main"

[tool.setuptools]
packages = ["docqa_audit", "docqa_audit.auditors"]
